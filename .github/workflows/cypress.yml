
name: Cypress API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ------------------------------------------------------------------------------
# System Test Jobs - QA (Petstore API)
# ------------------------------------------------------------------------------

jobs:
  test-api-qa:
    name: QA - ${{ matrix.resource }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - resource: Pet
            spec: cypress/e2e/pet/createPet.cy.js
          - resource: Store
            spec: cypress/e2e/store/createOrder.cy.js
          - resource: User
            spec: cypress/e2e/user/createUser.cy.js

    steps:
      # -------- SETUP --------

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Show Brazil date and time
        run: |
          echo "Current Date and Time (Brazil): $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M:%S')"

      # -------- RUN CYPRESS --------

      - name: Run Cypress API tests
        working-directory: api
        env:
          SPEC: ${{ matrix.spec }}
        run: |
          echo "Running spec: $SPEC"
          npm run test-qa -- --spec "$SPEC"

      # -------- UPLOAD RAW REPORTS --------

      - name: Upload Mochawesome raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-raw-${{ matrix.resource }}
          path: api/mochawesome-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.resource }}
          path: api/cypress/reports/screenshots/
          if-no-files-found: warn
          retention-days: 7

# ------------------------------------------------------------------------------
# Consolidated Reports
# ------------------------------------------------------------------------------

  reports:
    name: Consolidate QA Reports
    runs-on: ubuntu-latest

    needs: test-api-qa
    if: always()

    steps:
      # -------- SETUP --------

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      # -------- DOWNLOAD REPORTS --------

      - name: Download Mochawesome raw reports
        uses: actions/download-artifact@v4
        with:
          pattern: cypress-raw-*
          path: api/mochawesome-report
          merge-multiple: true

      - name: Download Cypress screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: cypress-screenshots-*
          path: api/cypress/reports/screenshots
          merge-multiple: true

      - name: List downloaded report files
        working-directory: api
        run: ls -al mochawesome-report/

      # -------- REPORTS --------

      - name: Merge Mochawesome JSON reports
        working-directory: api
        run: npm run cypress:merge-reports-json

      - name: Generate Mochawesome HTML
        working-directory: api
        run: npm run cypress:generate-report-html

      - name: Merge Mochawesome HTML
        working-directory: api
        run: npm run cypress:merge-report-html

      - name: List generated report files
        working-directory: api
        run: ls -al mochawesome-report/

      # -------- UPLOAD FINAL ARTIFACTS --------

      - name: Upload consolidated Mochawesome HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: api/mochawesome-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload consolidated JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: api/mochawesome-report/junit-report-*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload consolidated Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: api/cypress/reports/screenshots/
          if-no-files-found: warn
          retention-days: 7
